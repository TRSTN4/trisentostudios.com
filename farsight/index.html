	<header class="hero reveal-hero signal-jump" role="banner">
		<div class="spooky-bg" aria-hidden="true">
			<div class="bg-base"></div>
			<div class="bg-aurora"></div>
			<div class="bg-fog fog-1"></div>
			<div class="bg-fog fog-2"></div>

			<div class="bg-vignette"></div>
		</div>

				<div class="cd-box">
					<div class="cd-num" id="cdHours" data-shadow="00">00</div>

				</div>
				<div class="cd-box">
					<div class="cd-num" id="cdMins" data-shadow="00">00</div>
					<div class="cd-label">Minutes</div>
				</div>
				<div class="cd-box">
					<div class="cd-num" id="cdSecs" data-shadow="00">00</div>
					<div class="cd-label">Seconds</div>
				</div>
